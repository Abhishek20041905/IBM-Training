<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Employee Registration</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1c1b3a, #0d0d2d);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #292c6d;
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 90%;
      color: #fff;
      position: relative;
      animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
      color: #f1f1f1;
    }

    label {
      margin-top: 15px;
      display: block;
      font-weight: 500;
      color: #dcdcdc;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #666;
      background: #1f214f;
      color: #fff;
      font-size: 15px;
      transition: border 0.3s, transform 0.3s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #6c5ce7;
      transform: scale(1.02);
    }

    input.error, select.error {
      border: 2px solid #e74c3c;
      animation: shake 0.3s ease;
    }

    input[type="submit"] {
      background-color: #27ae60;
      border: none;
      margin-top: 25px;
      padding: 12px;
      font-size: 16px;
      color: #fff;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    input[type="submit"]:hover {
      background-color: #219150;
      transform: scale(1.03);
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      font-size: 13px;
    }

    .success {
      background: #2ecc71;
      padding: 12px;
      color: #fff;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
      border-radius: 8px;
      display: none;
      animation: popUp 0.4s ease;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    @keyframes popUp {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container" id="formBox">
    <h2>Employee Registration</h2>
    <form id="registrationForm">
      <label for="empid">Employee ID</label>
      <input type="text" id="empid" name="empid" required>

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="dept">Department</label>
      <select id="dept" name="dept" required>
        <option value="">Select Department</option>
        <option>HR</option>
        <option>IT</option>
        <option>Finance</option>
        <option>Marketing</option>
      </select>

      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <input type="submit" value="Register" id="submitBtn">
      <div class="success" id="successMsg">🎉 Registration Successful!</div>
    </form>
    <div class="footer">&copy; 2025 Company Inc.</div>
  </div>

  <script>
    const form = document.getElementById("registrationForm");
    const inputs = form.querySelectorAll("input, select");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      let valid = true;

      inputs.forEach(input => {
        if (!input.value.trim()) {
          input.classList.add("error");
          valid = false;
        } else {
          input.classList.remove("error");
        }
      });

      if (!valid) return;

      // Simulate loading and show success
      setTimeout(() => {
        successMsg.style.display = "block";
        form.reset();
        setTimeout(() => {
          successMsg.style.display = "none";
        }, 3000);
      }, 500);
    });
  </script>
</body>
</html>
